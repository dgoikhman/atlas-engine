name: Refresh data and deploy site
on:
  schedule:
    - cron: "0 6 1 * *"        # monthly, 1st at 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write               # lets this workflow trigger the repair agent
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Refresh public data (non-fatal)
        id: refresh
        continue-on-error: true
        run: |
          set -o pipefail
          python pipelines/public_data.py 2>&1 | tee data/last_refresh.log
      - name: Trigger repair agent if refresh failed
        if: steps.refresh.outcome == 'failure' && github.event_name == 'schedule'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run agent-task.yml -f task=scraper_repair || true
      - name: Refresh Census living context (non-fatal)
        continue-on-error: true
        env:
          CENSUS_KEY: ${{ secrets.CENSUS_KEY }}
        run: |
          set -o pipefail
          python pipelines/context.py 2>&1 | tee -a data/last_refresh.log
      - name: Build site
        run: python site/build.py --base-url "${{ vars.BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}"
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - name: Commit refreshed dataset (versioned, skip ci)
        run: |
          git config user.name "atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/last_refresh.log
          git add -f data/metros_live.csv 2>/dev/null || true
          git add -f data/metro_context.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: refreshed metros dataset [skip ci]"
          git push || true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
