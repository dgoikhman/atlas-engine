name: Refresh data and deploy site
on:
  schedule:
    - cron: "0 6 1 * *"        # monthly full refresh (Zillow/Census), 1st 06:00 UTC
    - cron: "0 11 * * *"       # daily: fresh Star Opportunities scan + rebuild
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write               # lets this workflow trigger the repair agent
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Refresh public data (non-fatal)
        id: refresh
        continue-on-error: true
        run: |
          set -o pipefail
          python pipelines/public_data.py 2>&1 | tee data/last_refresh.log
      - name: Trigger repair agent if refresh failed
        if: steps.refresh.outcome == 'failure' && github.event_name == 'schedule'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run agent-task.yml -f task=scraper_repair || true
      - name: Refresh Census living context (non-fatal)
        continue-on-error: true
        env:
          CENSUS_KEY: ${{ secrets.CENSUS_KEY }}
        run: |
          set -o pipefail
          python pipelines/context.py 2>&1 | tee -a data/last_refresh.log
      - name: Scan Star Opportunities (non-fatal)
        continue-on-error: true
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LISTINGS_DAILY: ${{ vars.LISTINGS_DAILY }}
          LISTINGS_ROTATION_DAYS: ${{ vars.LISTINGS_ROTATION_DAYS }}
        run: |
          set -o pipefail
          python pipelines/listings.py 2>&1 | tee -a data/last_refresh.log
      - name: Build site
        env:
          MEMBERS_TOKEN: ${{ secrets.MEMBERS_TOKEN }}
          STRIPE_LINK_ANNUAL: ${{ vars.STRIPE_LINK_ANNUAL }}
          STRIPE_LINK_PASS: ${{ vars.STRIPE_LINK_PASS }}
          FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          REFERRAL_LINK_LENDER: ${{ vars.REFERRAL_LINK_LENDER }}
        run: python site/build.py --base-url "${{ vars.BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}"
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - name: Commit refreshed dataset (versioned, skip ci)
        run: |
          git config user.name "atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/last_refresh.log
          git add -f data/metros_live.csv 2>/dev/null || true
          git add -f data/metro_context.csv 2>/dev/null || true
          git add -f data/star_opportunities.json 2>/dev/null || true
          git add -f data/why_cache.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: refreshed metros dataset [skip ci]"
          git push || true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
